# Zoom parent pane.
[[mgr.prepend_keymap]]
on   = ["e"]
run  = "plugin toggle-pane max-parent"
desc = "Maximize/restore parent pane"

# Zoom preview pane.
[[mgr.prepend_keymap]]
on   = "b"
run  = "plugin toggle-pane max-preview"
desc = "Maximize/restore preview pane"

# Smart enter.
[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter directory or open file"
